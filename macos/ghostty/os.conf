# cmd sits where alt sits on a PC keyboard, so these are the same physical
# keys as ctrl+alt+n / alt+n on Linux (see linux/ghostty/os.conf).

# open Ghostty from anywhere; needs Accessibility permission for global:
keybind = global:ctrl+super+n=new_window

# new tab, same fingers without ctrl. This takes over cmd+n from the default
# new_window, which is still reachable through the global hotkey above.
keybind = super+n=new_tab
