# cmd sits where alt sits on a PC keyboard, so these are the same physical
# keys as ctrl+alt+n / alt+n on Linux (see ../os.conf). ctrl+cmd+n, the
# one that opens Ghostty, is skhd's (misc/skhd/macos/skhdrc), since a
# Ghostty global keybind only works while Ghostty is already running.

# new tab, same fingers without ctrl. This takes over cmd+n from the default
# new_window.
keybind = super+n=new_tab
