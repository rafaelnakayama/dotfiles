# Prefix on Ctrl-a; Ctrl-a Ctrl-a sends a literal Ctrl-a through to the shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload this file in place.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

set -g mouse on
setw -g mode-keys vi

# 1-indexed, and close the gaps when a window is killed, so the window
# numbers always match what the status line shows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window names stay whatever I set them to.
set -g allow-rename off
set -g automatic-rename off

# tmux-256color is the correct terminfo for tmux itself; the override is what
# gets truecolor through to the programs running inside it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Pass modified keys like Shift+Enter through, so Claude Code can tell it
# apart from Enter. Without this tmux strips the modifier.
# usstyle passes underline style and color through, so Neovim's red
# diagnostic underline stays red instead of falling back to the text color.
# The reset first keeps prefix r from appending a duplicate on every reload.
set -s extended-keys on
set -su terminal-features
set -as terminal-features "xterm*:extkeys:usstyle"

# Type into every pane of the window at once.
bind C-y set-window-option synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"

# Visual select and yank, like vim. tmux-yank picks the right clipboard
# command per OS (pbcopy on macOS, wl-copy/xclip on Linux), so nothing here
# is platform-specific.
bind -T copy-mode-vi v send-keys -X begin-selection
# visual-block, same finger as vim.
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ---------- appearance ----------
# Tokyo Night, copied from Ghostty's own theme file so tmux and the
# terminal agree. magenta down to highlight are from tokyonight.nvim's palette,
# for the status bar ends. tmux has no font setting: Comic Mono comes from Ghostty.
tokyo_bg="#1a1b26"
tokyo_fg="#c0caf5"
tokyo_gray="#a9b1d6"
tokyo_blue="#7aa2f7"
tokyo_yellow="#e0af68"
tokyo_dark="#414868"
tokyo_magenta="#bb9af7"
tokyo_cyan="#7dcfff"
tokyo_teal="#73daca"
tokyo_blue7="#394b70"
tokyo_highlight="#292e42"

# Icons are Nerd Font glyphs written as \u escapes; Ghostty draws them from
# its built-in Nerd Font fallback, so Comic Mono needs no patching.
set -g status-position top
set -g status-style "bg=$tokyo_bg,fg=$tokyo_gray"
# Both ends are flat blocks that mirror each other and fade toward the
# windows: a magenta icon, then dark blue and darker blue blocks whose text
# carries the color instead of the background.
set -g status-left "#[bg=$tokyo_magenta,fg=$tokyo_bg]  #[bg=$tokyo_blue7,fg=$tokyo_cyan,bold] #S #[bg=$tokyo_highlight,fg=$tokyo_teal,nobold]  #{client_user} #[default] "
set -g status-left-length 50
set -g status-right "#[bg=$tokyo_highlight,fg=$tokyo_teal]  %H:%M #[bg=$tokyo_blue7,fg=$tokyo_cyan] %d/%m #[bg=$tokyo_magenta,fg=$tokyo_bg]  "

# Each window is a number block and a name block. The current one gets a
# blue number and a brighter name; the widths match, so tabs don't shift.
setw -g window-status-format "#[bg=$tokyo_gray,fg=$tokyo_bg] #I #[bg=$tokyo_dark,fg=$tokyo_gray] #W "
setw -g window-status-current-format "#[bg=$tokyo_blue,fg=$tokyo_bg,bold] #I #[bg=$tokyo_dark,fg=$tokyo_fg] #W "

set -g pane-border-style "fg=$tokyo_gray"
set -g pane-active-border-style "fg=$tokyo_blue"
set -g mode-style "bg=$tokyo_fg,fg=$tokyo_bg"
set -g message-style "bg=$tokyo_yellow,fg=$tokyo_bg"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # fixes a pile of bad defaults
set -g @plugin 'tmux-plugins/tmux-pain-control'  # | and - to split, HJKL to resize
set -g @plugin 'tmux-plugins/tmux-yank'          # system clipboard, cross-platform
set -g @plugin 'tmux-plugins/tmux-copycat'       # prefix + / regex search in scrollback
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save and restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # autosave every 15 min, needs resurrect
set -g @continuum-restore 'on'                   # restore the last save when the server starts

# Must stay last.
run '~/.config/tmux/plugins/tpm/tpm'
